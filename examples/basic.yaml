# Reads temperature and pressure from the Soldered BMP180 breakout board
# once per update_interval.

esphome:
  name: bmp180-basic

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components
    components: [bmp180]

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: bmp180
    update_interval: 5s
    oversampling: 3
    temperature:
      name: "BMP180 Temperature"
    pressure:
      name: "BMP180 Pressure"
